# Publishes the single release of the XXL set (all four plugins) from the zips in releases/, the same files that were
# built and tested as ARM code. Runs when releases/ changes on main, or by hand.
name: release
on:
  push:
    branches: [main]
    paths: ["releases/**", "docs/notes/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check every zip against its recorded sum
        run: cd releases && sha256sum -c SHA256SUMS.txt
      - name: Remove the earlier per-plugin releases and tags
        run: |
          for t in xxl-pro-v0.1.0 xxl-strip-v0.1.1 xxl-strip-bus-v0.1.1 xxl-strip-master-v0.1.1; do
            gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          done
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xxl-v0.1
          target_commitish: ${{ github.sha }}
          name: XXL set 0.1
          body_path: docs/notes/xxl-v0.1.md
          prerelease: false
          make_latest: true
          files: |
            releases/XXL-Pro-0.1.0-mpc-armv7.zip
            releases/XXL-STRIP-0.1.1-mpc-armv7.zip
            releases/XXL-STRIP-BUS-0.1.1-mpc-armv7.zip
            releases/XXL-STRIP-MASTER-0.1.1-mpc-armv7.zip
            releases/SHA256SUMS.txt

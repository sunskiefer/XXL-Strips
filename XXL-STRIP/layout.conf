# XXL STRIP for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Coordinates are Force Shadow pixels: the plugin area is x 0..1280, y 86..714 (skin y = shadow y - 86).
#
# FIRST FUNCTIONAL LAYOUT (0.1.0 build): the panel art, knob colours, VU needle and the final placement of every
# control come in the art phase (the Panel Editor decides positions; nothing here is final). Until then the controls
# sit on the Meta4MPCXXL grid: four columns (cx 160 / 480 / 800 / 1120), rows at cy 236 / 522 (a third at 640 for a meter).
# Captions of option rows and meters are `#@text` lines (tools/post_skin.py draws them, Titillium Web Bold, 30 px);
# the widgets' own small baked labels are left empty.
# Text: the Meta4MPCXXL 0.1.2 standard (scale_names=1, label_scale=1.7: knob names and values about 36 px).
# Q-Links: every control is on one, in reading order (tools/qlinks.py fills the `qlinks` lines). Meters are
# display-only (#@noqlink): the engine drives them.
scale_names=1
label_scale=1.7
theme_bg=24221e
theme_panel=24221e
theme_line=6c5a58
theme_ink=ffffff
theme_ink_dim=ffffff
theme_ink_faint=ffffff
theme_accent=6c5a58
theme_accent_hi=ffffff
theme_knob_face=d9d9e3
theme_knob_ring=101011
theme_knob_dot=111111
theme_bar=24221e
theme_seg_active=ffffff
theme_seg_inactive=101011
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=101011
theme_box=101011
theme_tile_on=ffffff
qlinks_track = in_gain,drive,out_gain,phase,model,os,vu_src

# ================================================================================================= INPUT
[tab INPUT]
#@noqlink vu
knob cx=160 cy=236 r=56 label="INPUT" key=in_gain
knob cx=480 cy=236 r=56 label="DRIVE" key=drive
knob cx=800 cy=236 r=56 label="OUTPUT" key=out_gain
toggle cx=1120 cy=236 label="PHASE" key=phase bw=220
enum_h cx=230 cy=500 label="" key=model sw=140 sh=60
enum_h cx=600 cy=500 label="" key=os sw=110 sh=60
enum_h cx=1000 cy=500 label="" key=vu_src sw=170 sh=60
slider_h cx=640 cy=630 w=1000 h=50 label="" key=vu ns=0
#@text tab=0 cx=230 cy=446 size=30 label="MODEL"
#@text tab=0 cx=600 cy=446 size=30 label="OVERSMP"
#@text tab=0 cx=1000 cy=446 size=30 label="VU SHOWS"
#@text tab=0 cx=80 cy=630 size=30 label="VU"
qlinks "INPUT" = in_gain,drive,out_gain,phase,model,os,vu_src

# ================================================================================================= FILTER
[tab FILTER]
toggle cx=160 cy=236 label="HPF" key=hpf_in bw=220
knob cx=480 cy=236 r=56 label="HPF FRQ" key=hpf_freq
toggle cx=800 cy=236 label="LPF" key=lpf_in bw=220
knob cx=1120 cy=236 r=56 label="LPF FRQ" key=lpf_freq
toggle cx=160 cy=540 label="EQ" key=eq_in bw=220
enum_h cx=540 cy=540 label="" key=dyn_pos sw=170 sh=60
enum_h cx=1010 cy=540 label="" key=sc_src sw=150 sh=60
#@text tab=1 cx=540 cy=486 size=30 label="DYNAMICS POSITION"
#@text tab=1 cx=1010 cy=486 size=30 label="SIDE CHAIN"
qlinks "FILTER" = hpf_in,hpf_freq,lpf_in,lpf_freq,eq_in,dyn_pos,sc_src

# ================================================================================================= EQ HI
[tab EQ HI]
knob cx=160 cy=236 r=56 label="HF GAIN" key=hf_gain
knob cx=480 cy=236 r=56 label="HF FRQ" key=hf_freq
enum_h cx=880 cy=236 label="" key=hf_bell sw=170 sh=60
knob cx=160 cy=522 r=56 label="HMF GAIN" key=hmf_gain
knob cx=480 cy=522 r=56 label="HMF FRQ" key=hmf_freq
knob cx=800 cy=522 r=56 label="HMF Q" key=hmf_q
toggle cx=1120 cy=522 label="HMF x3" key=hmf_x3 bw=220
#@text tab=2 cx=880 cy=182 size=30 label="HF SHAPE"
qlinks "EQ HI" = hf_gain,hf_freq,hf_bell,hmf_gain,hmf_freq,hmf_q,hmf_x3

# ================================================================================================= EQ LO
[tab EQ LO]
knob cx=160 cy=236 r=56 label="LMF GAIN" key=lmf_gain
knob cx=480 cy=236 r=56 label="LMF FRQ" key=lmf_freq
knob cx=800 cy=236 r=56 label="LMF Q" key=lmf_q
toggle cx=1120 cy=236 label="LMF /3" key=lmf_d3 bw=220
knob cx=160 cy=522 r=56 label="LF GAIN" key=lf_gain
knob cx=480 cy=522 r=56 label="LF FRQ" key=lf_freq
enum_h cx=880 cy=522 label="" key=lf_bell sw=170 sh=60
#@text tab=3 cx=880 cy=468 size=30 label="LF SHAPE"
qlinks "EQ LO" = lmf_gain,lmf_freq,lmf_q,lmf_d3,lf_gain,lf_freq,lf_bell

# ================================================================================================= COMP
[tab COMP]
#@noqlink gr
toggle cx=160 cy=236 label="DYNAMICS" key=dyn_in bw=220
knob cx=480 cy=236 r=56 label="THRESH" key=comp_thr
knob cx=800 cy=236 r=56 label="RATIO" key=comp_ratio
knob cx=1120 cy=236 r=56 label="RELEASE" key=comp_release
enum_h cx=200 cy=500 label="" key=comp_attack sw=150 sh=60
enum_h cx=600 cy=500 label="" key=makeup sw=150 sh=60
slider_h cx=700 cy=630 w=880 h=50 label="" key=gr ns=0
#@text tab=4 cx=200 cy=446 size=30 label="ATTACK"
#@text tab=4 cx=600 cy=446 size=30 label="MAKE-UP"
#@text tab=4 cx=130 cy=630 size=30 label="GAIN RED"
qlinks "COMP" = dyn_in,comp_thr,comp_ratio,comp_release,comp_attack,makeup

# ================================================================================================= GATE
[tab GATE]
#@noqlink gate_gr
toggle cx=160 cy=236 label="GATE" key=gate_in bw=220
enum_h cx=480 cy=236 label="" key=gate_mode sw=140 sh=60
knob cx=800 cy=236 r=56 label="THRESH" key=gate_thr
knob cx=1120 cy=236 r=56 label="RANGE" key=gate_range
knob cx=160 cy=522 r=56 label="HOLD" key=gate_hold
knob cx=480 cy=522 r=56 label="RELEASE" key=gate_release
toggle cx=800 cy=522 label="FAST ATT" key=gate_fast bw=220
slider_h cx=1120 cy=540 w=280 h=50 label="" key=gate_gr ns=0
#@text tab=5 cx=480 cy=182 size=30 label="MODE"
#@text tab=5 cx=1120 cy=486 size=30 label="GATE RED"
qlinks "GATE" = gate_in,gate_mode,gate_thr,gate_range,gate_hold,gate_release,gate_fast

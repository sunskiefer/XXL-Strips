# XXL STRIP BUS for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Coordinates are Force Shadow pixels: the plugin area is x 0..1280, y 86..714 (skin y = shadow y - 86).
#
# FIRST FUNCTIONAL LAYOUT (0.1.0 build): the panel art, knob colours, VU needle and the final placement of every
# control come in the art phase (the Panel Editor decides positions; nothing here is final). Until then the controls
# sit on the Meta4MPCXXL grid: four columns (cx 160 / 480 / 800 / 1120), rows at cy 236 / 522 (a third at 640 for a meter).
# Captions of option rows and meters are `#@text` lines (tools/post_skin.py draws them, Titillium Web Bold, 30 px);
# the widgets' own small baked labels are left empty.
# Text: the Meta4MPCXXL 0.1.2 standard (scale_names=1, label_scale=1.7: knob names and values about 36 px).
# Q-Links: every control is on one, in reading order (tools/qlinks.py fills the `qlinks` lines). Meters are
# display-only (#@noqlink): the engine drives them.
scale_names=1
label_scale=1.7
theme_bg=24221e
theme_panel=24221e
theme_line=6c5a58
theme_ink=ffffff
theme_ink_dim=ffffff
theme_ink_faint=ffffff
theme_accent=6c5a58
theme_accent_hi=ffffff
theme_knob_face=d9d9e3
theme_knob_ring=101011
theme_knob_dot=111111
theme_bar=24221e
theme_seg_active=ffffff
theme_seg_inactive=101011
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=101011

# ================================================================================================= COMP
[tab COMP]
#@noqlink gr
toggle cx=160 cy=236 label="COMP" key=comp_in bw=220
knob cx=480 cy=236 r=56 label="THRESH" key=thr
knob cx=800 cy=236 r=56 label="MAKE-UP" key=makeup
enum_h cx=1090 cy=236 label="" key=ratio sw=90 sh=60
enum_h cx=330 cy=470 label="" key=attack sw=105 sh=60
enum_h cx=960 cy=470 label="" key=release sw=115 sh=60
slider_h cx=700 cy=630 w=880 h=50 label="" key=gr ns=0
#@text tab=0 cx=1090 cy=182 size=30 label="RATIO"
#@text tab=0 cx=330 cy=416 size=30 label="ATTACK"
#@text tab=0 cx=960 cy=416 size=30 label="RELEASE"
#@text tab=0 cx=130 cy=630 size=30 label="GAIN RED"
qlinks "COMP" = comp_in,thr,makeup,ratio,attack,release

# ================================================================================================= OUTPUT
[tab OUTPUT]
#@noqlink vu
enum_h cx=200 cy=236 label="" key=mode sw=170 sh=60
toggle cx=560 cy=236 label="SC HPF" key=sc_hpf_in bw=220
knob cx=840 cy=236 r=56 label="SC FRQ" key=sc_hpf
knob cx=1120 cy=236 r=56 label="MIX" key=mix
knob cx=160 cy=500 r=56 label="INPUT" key=in_gain
knob cx=480 cy=500 r=56 label="OUTPUT" key=out_gain
enum_h cx=960 cy=450 label="" key=vu_src sw=170 sh=60
slider_h cx=960 cy=590 w=500 h=50 label="" key=vu ns=0
#@text tab=1 cx=200 cy=182 size=30 label="MODE"
#@text tab=1 cx=960 cy=396 size=30 label="VU SHOWS"
#@text tab=1 cx=960 cy=538 size=30 label="VU"
qlinks "OUTPUT" = mode,sc_hpf_in,sc_hpf,mix,in_gain,out_gain,vu_src

# XXL STRIP MASTER for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Coordinates are Force Shadow pixels: the plugin area is x 0..1280, y 86..714 (skin y = shadow y - 86).
#
# FIRST FUNCTIONAL LAYOUT (0.1.0 build): the panel art, knob colours, VU needle and the final placement of every
# control come in the art phase (the Panel Editor decides positions; nothing here is final). Until then the controls
# sit on the Meta4MPCXXL grid: four columns (cx 160 / 480 / 800 / 1120), rows at cy 236 / 522 (a third at 640 for a meter).
# Captions of option rows and meters are `#@text` lines (tools/post_skin.py draws them, Titillium Web Bold, 30 px);
# the widgets' own small baked labels are left empty.
# Text: the Meta4MPCXXL 0.1.2 standard (scale_names=1, label_scale=1.7: knob names and values about 36 px).
# Q-Links: every control is on one, in reading order (tools/qlinks.py fills the `qlinks` lines). Meters are
# display-only (#@noqlink): the engine drives them.
scale_names=1
label_scale=1.7
theme_bg=24221e
theme_panel=24221e
theme_line=6c5a58
theme_ink=ffffff
theme_ink_dim=ffffff
theme_ink_faint=ffffff
theme_accent=6c5a58
theme_accent_hi=ffffff
theme_knob_face=d9d9e3
theme_knob_ring=101011
theme_knob_dot=111111
theme_bar=24221e
theme_seg_active=ffffff
theme_seg_inactive=101011
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=101011

# ================================================================================================= DRIVE / EQ
[tab DRIVE EQ]
toggle cx=160 cy=236 label="DRIVE" key=drive_in bw=220
knob cx=480 cy=236 r=56 label="DRIVE" key=drive
knob cx=800 cy=236 r=56 label="DENSITY" key=density
toggle cx=1120 cy=236 label="EQ" key=eq_in bw=220
knob cx=160 cy=522 r=56 label="LF GAIN" key=lf_gain
enum_h cx=480 cy=522 label="" key=lf_freq sw=78 sh=60
knob cx=800 cy=522 r=56 label="HF GAIN" key=hf_gain
enum_h cx=1105 cy=522 label="" key=hf_freq sw=84 sh=60
#@text tab=0 cx=480 cy=468 size=30 label="LF FRQ  Hz"
#@text tab=0 cx=1105 cy=468 size=30 label="HF FRQ"
qlinks "DRIVE EQ" = drive_in,drive,density,eq_in,lf_gain,lf_freq,hf_gain,hf_freq

# ================================================================================================= HF COMP / IMAGE
[tab HF IMAGE]
#@noqlink gr
toggle cx=160 cy=236 label="HF COMP" key=hfc_in bw=220
knob cx=480 cy=236 r=56 label="THRESH" key=hfc_thr
knob cx=800 cy=236 r=56 label="X-OVER" key=hfc_xover
slider_h cx=1110 cy=250 w=300 h=50 label="" key=gr ns=0
toggle cx=160 cy=522 label="IMAGE" key=img_in bw=220
knob cx=480 cy=522 r=56 label="WIDTH" key=width
knob cx=800 cy=522 r=56 label="SPACE" key=space
#@text tab=1 cx=1110 cy=198 size=30 label="HF RED"
qlinks "HF IMAGE" = hfc_in,hfc_thr,hfc_xover,img_in,width,space

# ================================================================================================= OUTPUT
[tab OUTPUT]
#@noqlink vu
knob cx=160 cy=236 r=56 label="INPUT" key=in_gain
enum_h cx=520 cy=236 label="" key=hpf sw=95 sh=60
toggle cx=880 cy=236 label="TRANSF" key=trafo bw=220
knob cx=1120 cy=236 r=56 label="OUTPUT" key=out_gain
enum_h cx=300 cy=500 label="" key=vu_src sw=170 sh=60
slider_h cx=640 cy=630 w=1000 h=50 label="" key=vu ns=0
#@text tab=2 cx=520 cy=182 size=30 label="HPF"
#@text tab=2 cx=300 cy=446 size=30 label="VU SHOWS"
#@text tab=2 cx=80 cy=630 size=30 label="VU"
qlinks "OUTPUT" = in_gain,hpf,trafo,out_gain,vu_src
